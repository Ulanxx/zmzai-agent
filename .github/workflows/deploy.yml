name: deploy

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: [self-hosted, hk]
    env:
      PNPM_FETCH_TIMEOUT: "300000"
      PNPM_FETCH_RETRIES: "5"
      PNPM_NETWORK_CONCURRENCY: "1"
      PNPM_STORE_DIR: "/home/runner/.pnpm-store"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --offline --store-dir=/home/runner/.pnpm-store
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Restore Linux SWC fallback
        run: |
          SWC_DIR="node_modules/.pnpm/@next+swc-linux-x64-gnu@15.5.21/node_modules/@next/swc-linux-x64-gnu"
          if [ ! -f "$SWC_DIR/next-swc.linux-x64-gnu.node" ]; then
            mkdir -p "$SWC_DIR"
            tar -xzf /opt/zmzai/cache/next-swc-linux-x64-gnu-15.5.21.tgz --strip-components=1 -C "$SWC_DIR"
          fi
      - run: pnpm run build

  deploy:
    needs: quality
    runs-on: [self-hosted, hk]
    env:
      APP_NAME: agent
    steps:
      - name: Deploy
        run: bash /opt/zmzai/scripts/deploy-app.sh ${APP_NAME}
