name: deploy

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: [self-hosted, hk]
    env:
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      PNPM_FETCH_TIMEOUT: "300000"
      PNPM_FETCH_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  deploy:
    needs: quality
    runs-on: [self-hosted, hk]
    env:
      APP_NAME: agent
    steps:
      - name: Deploy
        run: bash /opt/zmzai/scripts/deploy-app.sh ${APP_NAME}
